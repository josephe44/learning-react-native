        <h1>React Native Internals</h1>
        <p>
          An interactive visual guide to how React Native works under the hood: 27 hands-on lessons,
          a connection map, a Swift and SwiftUI track for React Native engineers, and a todo app
          built twice (React Native with Expo, and Swift with SwiftUI). This site needs JavaScript
          to run its interactive demos.
        </p>
        <h2>The 27 lessons</h2>
        <ol style="list-style: none; padding: 0">
          <li>
            <strong>1. Big Picture</strong>: React Native runs your JavaScript, but draws real
            native views — three worlds talking to each other across threads.
          </li>
          <li>
            <strong>2. JavaScript Engine</strong>: A tiny JS engine inside your app runs your code.
            Hermes precompiles it so startup is fast.
          </li>
          <li>
            <strong>3. The Old Bridge</strong>: JS and native used to pass JSON letters through a
            single async mailbox — slow when traffic spikes.
          </li>
          <li>
            <strong>4. JSI</strong>: JSI lets JavaScript hold direct references to C++ objects, so
            calls are synchronous and need no JSON.
          </li>
          <li>
            <strong>5. Turbo Modules</strong>: Native modules, but lazy-loaded, typed, and callable
            through JSI.
          </li>
          <li>
            <strong>6. Codegen</strong>: You write a typed spec once; build tools generate the
            C++/ObjC/Kotlin glue that keeps both sides in sync.
          </li>
          <li>
            <strong>7. Fabric</strong>: The renderer: React output → immutable shadow tree → commit
            → mount real native views.
          </li>
          <li>
            <strong>8. Layout Engine</strong>: Yoga computes flexbox positions in C++ on the shadow
            tree.
          </li>
          <li>
            <strong>9. React Reconciler</strong>: Fiber decides what changed and schedules updates
            by priority.
          </li>
          <li>
            <strong>10. Event System</strong>: How a finger touch travels from native to your
            onPress.
          </li>
          <li>
            <strong>11. Bridgeless Mode</strong>: The bridge is gone entirely; ReactHost owns the
            runtime.
          </li>
          <li>
            <strong>12. Bundling &amp; Metro</strong>: Metro turns your files into one bundle and
            hot-swaps edits.
          </li>
          <li><strong>13. App Startup</strong>: From icon tap to first screen, step by step.</li>
          <li>
            <strong>14. Platform: iOS</strong>: AppDelegate, Obj-C++ glue, UIKit views, CocoaPods.
          </li>
          <li>
            <strong>15. Platform: Android</strong>: ReactActivity, JNI/fbjni, Android Views, Gradle.
          </li>
          <li>
            <strong>16. Animations</strong>: Animated, native driver, LayoutAnimation, Reanimated
            worklets.
          </li>
          <li><strong>17. Gesture Handling</strong>: Native recognizers beat JS responders.</li>
          <li><strong>18. Lists &amp; Virtualization</strong>: Only render what is on screen.</li>
          <li>
            <strong>19. Text Rendering</strong>: Attributed strings measured by platform text
            engines.
          </li>
          <li><strong>20. Images &amp; Assets</strong>: Asset resolution, loading, caching.</li>
          <li><strong>21. Networking &amp; Storage</strong>: fetch, WebSockets, Blobs, storage.</li>
          <li>
            <strong>22. Memory &amp; Performance</strong>: Where memory lives and where frames drop.
          </li>
          <li><strong>23. Debugging Tooling</strong>: DevTools, CDP, LogBox, inspector.</li>
          <li><strong>24. Error Handling</strong>: How errors cross the layers.</li>
          <li>
            <strong>25. Build &amp; Release</strong>: Release bundles, bytecode, source maps, OTA.
          </li>
          <li>
            <strong>26. Extending RN</strong>: Native modules, components, C++, other platforms.
          </li>
          <li><strong>27. Ecosystem Layer</strong>: Expo, CLIs, autolinking.</li>
        </ol>
